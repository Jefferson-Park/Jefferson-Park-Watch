<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>UNNC Greening Master Plan</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ══════════════════════════════════════════════════════════════════
       UNIFIED DESIGN SYSTEM & THEME TOKENS
       ══════════════════════════════════════════════════════════════════ */
    :root {
      --accent:   #5B7A47;   /* Signature Sage Green */
      --blue:     #2B6CB0;   /* Informational Boundary Accent */
      --amber:    #C4780A;   /* Secondary / Maintenance Actions */
      --danger:   #B93020;   /* Critical Alerts */
      --bg:       #F4F1EB;   /* Warm Surface Canvas */
      --panel:    #FFFFFF;   /* Foreground Card Panels */
      --panel2:   #EDE9E0;   /* Container Borders / Secondary Modifiers */
      --border:   #D8D3C7;   
      --text:     #2C2825;   /* High Contrast Typography */
      --muted:    #7A6E62;   
      --font:     'DM Sans', system-ui, sans-serif;
      --mono:     'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--text); }

    /* Layout Shell */
    #layout-container { display: flex; width: 100%; height: 100%; position: relative; }
    
    /* Control Panel Drawer */
    #sidebar-panel {
      width: 320px; height: 100%; background: var(--panel);
      border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1010;
    }
    .panel-header { padding: 20px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
    .panel-header h1 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .panel-header p { font-size: 11px; color: var(--muted); font-family: var(--mono); }
    
    .scrollable-body { flex: 1; overflow-y: auto; padding: 16px; }
    
    /* Filter UI Elements */
    .filter-group { margin-bottom: 20px; }
    .filter-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; font-family: var(--mono); }
    .filter-select { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; color: var(--text); font-family: var(--font); outline: none; }
    .filter-select:focus { border-color: var(--accent); }

    /* Metric Badges */
    .metric-pill {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; background: var(--panel2); border-radius: 8px; margin-bottom: 12px;
    }
    .metric-title { font-size: 12px; font-weight: 500; }
    .metric-value { font-family: var(--mono); font-size: 12px; font-weight: 600; background: var(--accent); color: white; padding: 2px 8px; border-radius: 20px; }

    /* Map Interface */
    #leaflet-map-canvas { flex: 1; height: 100%; z-index: 1000; }

    /* Navigation Link Shortcuts */
    .utility-footer { padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel2); display: flex; gap: 8px; }
    .btn-link { flex: 1; text-align: center; padding: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; text-decoration: none; color: var(--text); font-weight: 500; }
    .btn-link:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

  <div id="layout-container">
    <aside id="sidebar-panel">
      <div class="panel-header">
        <h1>Greening Master Plan</h1>
        <p>UNNC Corridor Toolset</p>
      </div>

      <div class="scrollable-body">
        <div class="metric-pill">
          <span class="metric-title">Active Greening Targets</span>
          <span id="cnt-greening" class="metric-value">0</span>
        </div>

        <div class="filter-group">
          <div class="filter-label">Project Execution Phase</div>
          <select id="filter-phase" class="filter-select" onchange="applyLayerFilters()">
            <option value="all">View All Phases</option>
            <option value="planning">Planning & Assessment</option>
            <option value="approved">Approved Targets</option>
            <option value="planted">Completed / Maintained</option>
          </select>
        </div>

        <div class="filter-group">
          <div class="filter-label">Primary Funding/Partners</div>
          <select id="filter-funding" class="filter-select" onchange="applyLayerFilters()">
            <option value="all">All Funding Allocations</option>
            <option value="city">City Greening Grants</option>
            <option value="community">Neighborhood Capital</option>
            <option value="private">Private Sponsorship</option>
          </select>
        </div>
      </div>

      <div class="utility-footer">
        <a href="JP_NIM.html" class="btn-link">Community Map</a>
        <a href="admin.html" class="btn-link">Admin System</a>
      </div>
    </aside>

    <main id="leaflet-map-canvas"></main>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════════
    // GLOBAL STATE INTERFACES
    // ══════════════════════════════════════════════════════════════════
    let map = null;
    let greeningPinsLayerGroup = L.layerGroup();
    let treeEquityGeoJsonLayer = null;
    let liveCachePins = [];

    // Initialize Supabase using Configuration Engine from System Files
    const SUPABASE_URL = "https://your-supabase-project-url.supabase.co"; 
    const SUPABASE_ANON_KEY = "your-anon-public-key";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ══════════════════════════════════════════════════════════════════
    // MAP SYSTEM ENGINE LOGIC
    // ══════════════════════════════════════════════════════════════════
    document.addEventListener("DOMContentLoaded", () => {
      initMapInterface();
      fetchTreeEquityData();
      loadLiveGreeningPins();
    });

    function initMapInterface() {
      // Centered on the Jefferson Boulevard Commercial Corridor
      map = L.map('leaflet-map-canvas', {
        center: [34.0250, -118.3200],
        zoom: 14,
        zoomControl: false
      });

      // Layer Definition Hierarchy (CartoDB Positron for high contrast legibility)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      }).addTo(map);

      L.control.zoom({ position: 'topright' }).addTo(map);
      greeningPinsLayerGroup.addTo(map);
    }

    // ══════════════════════════════════════════════════════════════════
    // LAYER TRANSITIONS: TREE EQUITY ASSETS (DECOUPLED ASYNC MODULE)
    // ══════════════════════════════════════════════════════════════════
    async function fetchTreeEquityData() {
      try {
        // Point this endpoint directly to your storage bucket or public data route
        const response = await fetch('https://your-supabase-bucket.supabase.co/storage/v1/object/public/geojson/unnctes.geojson');
        if (!response.ok) throw new Error("Data asset target offline");
        const geojsonData = await response.json();

        treeEquityGeoJsonLayer = L.geoJson(geojsonData, {
          style: function(feature) {
            const priorityIndex = feature.properties.priority_i || 0;
            // High visibility mapping color spectrum based on priority thresholds
            return {
              fillColor: priorityIndex > 0.5 ? '#B93020' : '#5B7A47',
              weight: 1.5,
              opacity: 0.8,
              color: '#D8D3C7',
              fillOpacity: 0.18
            };
          },
          onEachFeature: function(feature, layer) {
            if (feature.properties) {
              layer.bindPopup(`
                <div style="padding: 8px; font-family: var(--font);">
                  <b style="font-size: 13px; color: var(--accent);">Tree Equity Target Block</b><br>
                  <span style="font-size:11px; color: var(--muted);">GEOID: ${feature.properties.GEOID || 'N/A'}</span><br>
                  <hr style="margin: 6px 0; border:0; border-top:1px solid var(--border);">
                  <div style="font-size:12px;">Score: <b>${feature.properties.tes || 'N/A'}</b> / 100</div>
                  <div style="font-size:12px;">Canopy Gap: <b>${Math.round((feature.properties.tc_gap || 0) * 100)}%</b></div>
                </div>
              `);
            }
          }
        }).addTo(map);
      } catch (err) {
        console.warn("[GMP Engine] GeoJSON layer asset loading fallback executed:", err.message);
      }
    }

    // ══════════════════════════════════════════════════════════════════
    // DATA LAYER SYNCHRONIZATION FROM SUPABASE VIEW
    // ══════════════════════════════════════════════════════════════════
    async function loadLiveGreeningPins() {
      try {
        // Queries structural view matching database mutations
        const { data, error } = await sb
          .from('v_greening_map_pins')
          .select('*');

        if (error) throw error;

        liveCachePins = data || [];
        renderMapFeatures(liveCachePins);
      } catch (err) {
        console.error("[GMP Sync Engine] Query fault on v_greening_map_pins view:", err.message);
      }
    }

    function renderMapFeatures(pins) {
      greeningPinsLayerGroup.clear();
      
      pins.forEach(pin => {
        if (!pin.lat || !pin.lng) return;

        // Custom stylized markers configured via matching dashboard configurations
        const statusColor = pin.phase === 'planted' ? 'var(--accent)' : 
                            pin.phase === 'approved' ? 'var(--blue)' : 'var(--amber)';

        const pinMarker = L.circleMarker([pin.lat, pin.lng], {
          radius: 8,
          fillColor: statusColor,
          color: '#FFFFFF',
          weight: 2,
          fillOpacity: 0.9
        });

        // Formats interactive descriptions cleanly inside the popup wrapper
        const inlinePopupDetails = `
          <div style="padding:10px; font-family:var(--font); color:var(--text); max-width:240px">
            <div style="font-weight:600; font-size:13px; color:${statusColor}; margin-bottom:4px;">
              ${pin.species_common || 'Proposed Tree Site'}
            </div>
            <div style="font-size:11px; line-height:1.4; margin-bottom:6px;">
              ${pin.notes || 'No description notes logged for this target site.'}
            </div>
            <hr style="border:0; border-top:1px solid var(--border); margin:6px 0;">
            <div style="font-size:10px; color:var(--muted); font-family:var(--mono);">
              PHASE: ${pin.phase ? pin.phase.toUpperCase() : 'PLANNING'}<br>
              PARTNER: ${pin.partners || 'Unassigned'}
            </div>
          </div>
        `;

        pinMarker.bindPopup(inlinePopupDetails);
        greeningPinsLayerGroup.addLayer(pinMarker);
      });

      // Synchronize Badge Counters
      const countDisplay = document.getElementById('cnt-greening');
      if (countDisplay) countDisplay.textContent = pins.length;
    }

    // ══════════════════════════════════════════════════════════════════
    // RUNTIME FILTER TRANSITIONS
    // ══════════════════════════════════════════════════════════════════
    function applyLayerFilters() {
      const targetPhase = document.getElementById('filter-phase').value;
      const targetFunding = document.getElementById('filter-funding').value;

      const filteredSubset = liveCachePins.filter(pin => {
        const matchesPhase = (targetPhase === 'all' || pin.phase === targetPhase);
        const matchesFunding = (targetFunding === 'all' || (pin.partners && pin.partners.toLowerCase().includes(targetFunding)));
        return matchesPhase && matchesFunding;
      });

      renderMapFeatures(filteredSubset);
    }
  </script>
</body>
</html>
