<!DOCTYPE html>
<html>
<body>
  <h2>Set New Password</h2>
  <input type="password" id="new-password" placeholder="New Password">
  <button onclick="updatePassword()">Update Password</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

  // The Supabase SDK automatically reads the token from the URL hash.
  // You don't need manual logic to "catch" it if you are using the default flow.

  async function updatePassword() {
    const newPassword = document.getElementById('new-password').value;
    
    // updatePassword is only called when the user clicks the button.
    // The Supabase client ALREADY knows the user because of the URL token.
    const { data, error } = await supabase.auth.updateUser({
      password: newPassword
    });

    if (error) {
      alert('Error: ' + error.message);
    } else {
      alert('Password updated successfully!');
      window.location.href = 'JP_NIM.html'; // Redirect to your login page
    }
  }
</script>
</body>
</html>
